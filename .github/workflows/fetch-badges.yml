name: Fetch national team badges

on:
  workflow_dispatch:
  push:
    paths:
      - tools/national-teams.txt
      - tools/fetch_badges.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_badges.py
      - name: Commit new badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet || (git commit -m "Add national team badges from Wikipedia" && git push)
